<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Colour Picker</title>
        <link rel="icon" href="data:,">


        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <section class="colour-op">
        <input type="color">
        <select name="palette-op" id="palette-op">
            <option value="monochrome">Monochrome</option>
            <option value="monochrome-dark">Monochrome-Dark</option>
            <option value="monochrome-light">Monochrome-Light</option>
            <option value="analogic">Analogic</option>
            <option value="complement">Complement</option>
            <option value="nalogic-complement">Analogic-Complement</option>
            <option value="triad">Triad</option>
            <option value="quad">Quad</option>
        </select>
        <button>Get colour scheme</button>
        </section>

        <section class="colours-grid">
            <div class="colour-grid">
                <div class="grid-1-colour"></div>
                <p class="grid-1-name">#2B283A</p>
            </div>
            <div class="colour-grid">
                <div class="grid-2-colour"></div>
                <p class="grid-2-name"></p>
            </div>
            <div class="colour-grid">
                <div class="grid-3-colour"></div>
                <p class="grid-3-name"></p>
            </div>
            <div class="colour-grid">
                <div class="grid-4-colour"></div>
                <p class="grid-4-name"></p>
            </div>
            <div class="colour-grid">
                <div class="grid-5-colour"></div>
                <p class="grid-5-name"></p>
            </div>
            <!-- x5 -->
        </section>
        

        <script src="index.js" type="module"></script>
    </body>
</html>
